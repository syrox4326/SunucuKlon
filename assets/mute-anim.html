<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#0B1020}svg{display:block}</style>
<svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#14204A"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  </defs>
  <rect width="640" height="200" fill="url(#bg)"/>
  <g id="waves" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round">
    <path id="w1" d="M270 80 Q252 100 270 120"/><path id="w2" d="M246 66 Q216 100 246 134"/>
    <path id="w3" d="M370 80 Q388 100 370 120"/><path id="w4" d="M394 66 Q424 100 394 134"/>
  </g>
  <g id="mic" fill="none" stroke="#F4F6FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="303" y="46" width="34" height="66" rx="17"/>
    <path d="M286 96 a34 34 0 0 0 68 0"/><line x1="320" y1="132" x2="320" y2="154"/><line x1="300" y1="154" x2="340" y2="154"/>
  </g>
  <line id="slash" x1="268" y1="40" x2="372" y2="160" stroke="#E5484D" stroke-width="10" stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="160"/>
</svg>
<script>
const t=parseFloat((location.hash.match(/t=([\d.]+)/)||[0,0])[1]);
const cl=(x)=>Math.max(0,Math.min(1,x)), ease=(x)=>x*x*(3-2*x);
// 0-.4 dalgalar atar | .4-.62 çizgi çekilir, dalgalar söner | .62-.9 sabit | .9-1 başa dönüş
const wavePulse=(i)=>{const p=(t*2.5 - i*0.18)%1; return 0.35+0.65*Math.abs(Math.sin(p*Math.PI));};
let wa = t<.4 ? 1 : 1-ease(cl((t-.4)/.22));
let sl = ease(cl((t-.4)/.22));
let fade = t>.9 ? 1-ease(cl((t-.9)/.1)) : 1; sl*= 1; 
const ws=['w1','w2','w3','w4'];
ws.forEach((id,i)=>{document.getElementById(id).setAttribute('opacity',(wa*(t<.4?wavePulse(i%2):1)*(t>.9?ease(cl((t-.9)/.1)):1)).toFixed(3));});
const s=document.getElementById('slash');
s.setAttribute('stroke-dashoffset',(160*(1-(t>.9?1:sl))).toFixed(1));
s.setAttribute('opacity',(t>.9?fade:1).toFixed(3));
</script>

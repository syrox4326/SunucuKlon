<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1A2147"/>
      <stop offset="1" stop-color="#090C18"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A7BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- yumuşak parıltı -->
  <polygon points="512,212 772,362 772,662 512,812 252,662 252,362" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linejoin="round" opacity=".55" filter="url(#glow)"/>
  <!-- altıgen kalkan -->
  <polygon points="512,212 772,362 772,662 512,812 252,662 252,362" fill="#0E1330" fill-opacity=".6" stroke="url(#ring)" stroke-width="26" stroke-linejoin="round"/>
  <!-- K monogramı -->
  <g fill="none" stroke="#F4F6FF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <line x1="428" y1="382" x2="428" y2="642"/>
    <line x1="428" y1="512" x2="608" y2="382"/>
    <line x1="428" y1="512" x2="608" y2="642"/>
  </g>
  <circle cx="608" cy="382" r="20" fill="#22D3EE"/>
</svg>

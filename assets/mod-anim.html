<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#0B1020}svg{display:block}</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#14204A"/></linearGradient>
  </defs>
  <rect width="640" height="200" fill="url(#bg)"/>
  <!-- kick sahnesi -->
  <g id="door" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M452 150 V48 H520 V150"/><line x1="440" y1="150" x2="532" y2="150"/>
  </g>
  <g id="chev" fill="none" stroke="#F97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path id="c1" d="M340 80 L360 100 L340 120"/><path id="c2" d="M372 80 L392 100 L372 120"/><path id="c3" d="M404 80 L424 100 L404 120"/>
  </g>
  <!-- kişi -->
  <g id="kisi" fill="#F4F6FF">
    <circle id="bas" cx="0" cy="0" r="19"/>
    <path id="omuz" d="M0 0"/>
  </g>
  <!-- ban / unban: halka, çizgi, tik -->
  <circle id="halka" cx="320" cy="100" r="72" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="452.4" stroke-dashoffset="452.4" transform="rotate(-90 320 100)"/>
  <line id="cizgi" x1="269" y1="49" x2="371" y2="151" stroke="#EF4444" stroke-width="9" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="145"/>
  <path id="tik" d="M290 102 L312 124 L352 76" fill="none" stroke="#30A46C" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"/>
</svg>
<script>
const q=new URLSearchParams(location.hash.slice(1));
const sahne=q.get('s'), t=parseFloat(q.get('t'));
const $=(id)=>document.getElementById(id);
const cl=(x)=>Math.max(0,Math.min(1,x)), ease=(x)=>x*x*(3-2*x), seg=(a,b)=>ease(cl((t-a)/(b-a)));
function kisi(cx,op){ // cx merkez x, op saydamlık
  $('bas').setAttribute('cx',cx);$('bas').setAttribute('cy',78);
  $('omuz').setAttribute('d',`M${cx-42} 140 Q${cx-42} 104 ${cx} 104 Q${cx+42} 104 ${cx+42} 140 Z`);
  $('kisi').setAttribute('opacity',op.toFixed(3));
}
const tum=(...ids)=>ids.forEach(i=>$(i).setAttribute('opacity',0));
// başlangıçta hepsi gizli
['door','chev','halka','cizgi','tik'].forEach(i=>$(i).setAttribute('opacity',0));
const girisCikis=(a,b)=>seg(0,a)*(1-seg(b,1)); // 0-a arası girer, b-1 arası çıkar

if(sahne==='kick'){
  $('door').setAttribute('stroke','#F4F6FF'); $('door').setAttribute('opacity',1);
  const x=230+210*seg(.18,.6);
  const op=girisCikis(.08,.99)*(1-seg(.52,.68)); kisi(x,op);
  // kapı kırmızı-turuncu parlar
  const parla=seg(.58,.7)*(1-seg(.88,.98)); $('door').setAttribute('stroke',parla>.05?'#F97316':'#F4F6FF');
  ['c1','c2','c3'].forEach((id,i)=>{const p=cl(Math.sin((t*3-i*.12)*Math.PI*2)*.5+.5); $(id).setAttribute('opacity',(0.25+.75*p)*seg(.1,.2)*(1-seg(.5,.62)));});
  $('chev').setAttribute('opacity',1);
}
if(sahne==='ban'){
  kisi(320,seg(0,.12)*(1-seg(.93,1)));
  const ring=seg(.16,.5), cz=seg(.44,.64), son=1-seg(.93,1);
  $('halka').setAttribute('stroke','#EF4444');$('halka').setAttribute('opacity',son);
  $('halka').setAttribute('stroke-dashoffset',452.4*(1-ring));
  $('cizgi').setAttribute('opacity',son);$('cizgi').setAttribute('stroke-dashoffset',145*(1-cz));
  const p=1+0.05*Math.sin(cl((t-.64)/.2)*Math.PI);$('halka').setAttribute('transform',`rotate(-90 320 100) translate(0 0)`);
  $('halka').style.transformOrigin='320px 100px';$('halka').style.transform=`rotate(-90deg) scale(${p})`;
}
if(sahne==='unban'){
  kisi(320,seg(0,.1)*(1-seg(.93,1)));
  const kirmizi=(1-seg(.1,.4))*seg(0,.06), yesil=seg(.38,.62), tik=seg(.58,.78), son=1-seg(.93,1);
  $('halka').setAttribute('stroke-dashoffset',0);
  $('halka').setAttribute('stroke',yesil>.5?'#30A46C':'#EF4444');
  $('halka').setAttribute('opacity',Math.max(kirmizi,yesil)*son);
  $('cizgi').setAttribute('opacity',kirmizi*son);$('cizgi').setAttribute('stroke-dashoffset',145*seg(.1,.4));
  $('tik').setAttribute('opacity',son);$('tik').setAttribute('stroke-dashoffset',100*(1-tik));
}
</script>
